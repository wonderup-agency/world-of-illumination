<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — Location Map (single location)</title>

    <!-- Mapbox GL JS via CDN — in Webflow this <link> goes in Site Settings → Custom Code → Head -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="padding-global">
      <h1>Location Map</h1>

      <!--
        The ONLY Webflow binding: data-map-lat / data-map-lng on the wrapper.
        Marker priority: [data-map-marker] custom pin → .location_logo circular
        face → plain pin. Comment out the data-map-marker img below to see the
        logo face, and the logo too to see the plain pin.
        The reset button is injected by JS (no [data-map="reset"] here).
      -->
      <div
        data-component="location-map"
        data-map-lat="35.1495"
        data-map-lng="-90.0490"
        class="location-map_wrapper"
      >
        <img
          class="location_logo hide"
          src="../assets/g1.jpg"
          alt=""
          style="display: none"
        />
        <!-- Custom map pin (CMS image field, hidden page-side) -->
        <img
          src="https://cdn.prod.website-files.com/6a205e39ec626f3db3abd22f/6a2b49c1e02ead14fc478c03_Theme%3DCandy.svg"
          data-map-marker="img"
          alt=""
          class="hide"
          style="display: none"
        />
        <div data-map="map" class="location-map_map"></div>
      </div>
    </div>

    <!-- Mapbox GL JS — in Webflow this goes Before </body> -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
